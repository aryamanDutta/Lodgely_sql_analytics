services:
  db:
    image: mysql:8.0
    container_name: hotel_cam5_db
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_secure_password_2026}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-hotel_management}
      MYSQL_USER: ${MYSQL_USER:-hotel_admin}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-hotel_secure_pwd_2026}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  web:
    build: .
    container_name: hotel_cam5_web
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${MYSQL_USER:-hotel_admin}
      DB_PASSWORD: ${MYSQL_PASSWORD:-hotel_secure_pwd_2026}
      DB_NAME: ${MYSQL_DATABASE:-hotel_management}
      SECRET_KEY: ${SECRET_KEY:-cam5-hotel-secret-key-xyz}
      FLASK_DEBUG: ${FLASK_DEBUG:-0}
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data:
    name: hotel_cam5_mysql_data
